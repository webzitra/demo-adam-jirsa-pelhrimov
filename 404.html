<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stránka nenalezena · Adam Jirsa</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0d0f">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <style>
    @font-face {
      font-family: 'Inter';
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+2000-206F, U+2212;
    }

    @font-face {
      font-family: 'Inter';
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latinext-cs.woff2') format('woff2');
      unicode-range: U+0100-017F;
    }

    @font-face {
      font-family: 'Barlow Condensed';
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/barlow-condensed-600.woff2') format('woff2');
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a0d0f; color-scheme: dark; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 2rem 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      background: #0a0d0f;
      color: #f1f4f5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .kod {
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      font-weight: 600;
      font-size: clamp(5.5rem, 22vw, 9rem);
      line-height: 0.85;
      letter-spacing: -0.01em;
      color: #303840;
    }

    h1 {
      margin-top: 1.5rem;
      font-size: clamp(1.75rem, 1.3rem + 2vw, 2.5rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    p {
      margin-top: 1rem;
      font-size: 1.0625rem;
      color: #b7c1c6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 2rem;
      padding: 0 1.5rem;
      border-radius: 16px;
      background: #56c8e0;
      color: #031418;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 220ms ease;
    }

    .btn:hover { background: #7fd6e8; }

    .odkazy {
      display: flex;
      flex-wrap: wrap;
      gap: 0 1.25rem;
      margin-top: 1rem;
    }

    .odkazy a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: #b7c1c6;
      font-size: 0.9375rem;
      text-decoration: none;
    }

    .odkazy a:hover { color: #f1f4f5; }

    a:focus-visible {
      outline: 2px solid #56c8e0;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="kod" aria-hidden="true">404</div>
    <h1>Tuhle stránku jsem nenatrénoval</h1>
    <p>Vypadá to, že stránka, kterou hledáš, neexistuje nebo byla přesunuta. Nevadí, vrať se zpět a pokračuj dál.</p>
    <a href="/" class="btn">Zpět na úvod</a>
    <nav class="odkazy" aria-label="Další stránky">
      <a href="/#sluzby">Služby</a>
      <a href="/#kontakt">Kontakt</a>
      <a href="/online-koucink/">Online koučink</a>
    </nav>
  </main>
</body>
</html>
